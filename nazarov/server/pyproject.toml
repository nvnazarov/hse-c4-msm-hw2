[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.129.0",
    "numpy>=2.2.6",
    "pydantic-settings>=2.13.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "isort>=7.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"

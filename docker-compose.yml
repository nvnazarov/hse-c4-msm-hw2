services:
  server:
    build:
      context: "./nazarov/server"
      dockerfile: "./docker/Dockerfile.${MOD:-dev}"
    environment:
      - "APP_HOST=0.0.0.0"
      - "APP_PORT=80"
      - "APP_SQLITE__DB=/tmp/app/storage.db"
    volumes:
      - "storage:/tmp/app"
    ports:
      - "127.0.0.1:8080:80"

  client:
    build:
      context: "./nazarov/client"
      dockerfile: "./docker/Dockerfile.${MOD:-dev}"
    environment:
      - "APP_API_BASE_URL=http://server:80/api"
    volumes:
      - "./nazarov/client/src:/app/src"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"

networks:
  private: {}

volumes:
  storage: {}
